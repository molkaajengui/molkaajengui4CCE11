server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: autoloc-api

  # Configuration MySQL pour XAMPP (phpMyAdmin)
  datasource:
    url: jdbc:mysql://localhost:3306/autoloc_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jackson:
    serialization:
      fail-on-empty-beans: false
